services:
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    ports:
      - "8001:8001"
    volumes:
      - ./models:/models
    command: >
      --hf-repo unsloth/Qwen3.5-9B-GGUF
      --hf-file Qwen3.5-9B-Q8_0.gguf
      --alias unsloth/Qwen3.5-9B
      --host 0.0.0.0
      --port 8001
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p 0.0
      --ctx-size 16384
      --jinja
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
