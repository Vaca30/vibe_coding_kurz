# Documentation only — see ../../README.md → "LLM provider auth".
#
# The required minimum (subscription OAuth path for the LLM provider):
#
#   kubectl create namespace openclaw-lukas
#   kubectl -n openclaw-lukas create secret generic openclaw-secrets \
#     --from-literal=OPENCLAW_GATEWAY_TOKEN="$(openssl rand -hex 32)"
#
# Then run `openclaw models auth login --provider openai-codex` (with `-it`)
# inside the pod (see the README) to attach a ChatGPT/Codex subscription.
#
# Add LLM API keys below ONLY for providers you want to bill per-token instead
# of via subscription OAuth.

apiVersion: v1
kind: Secret
metadata:
  name: openclaw-secrets
  namespace: openclaw-lukas
type: Opaque
stringData:
  OPENCLAW_GATEWAY_TOKEN: "REPLACE_WITH_openssl_rand_hex_32"
  # ANTHROPIC_API_KEY: "sk-ant-..."
  # OPENAI_API_KEY: "sk-..."
  # GEMINI_API_KEY: "..."
  # OPENROUTER_API_KEY: "sk-or-..."
