apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Template for a new OpenClaw instance. To bootstrap:
#   1. cp -r overlays/_template overlays/<name>
#   2. Replace OPENCLAW_INSTANCE in this file and any sibling YAML.
#   3. Create the Secret out-of-band (see ../../README.md → Secrets).
#   4. kubectl apply -k overlays/<name>

namespace: openclaw-OPENCLAW_INSTANCE

resources:
  - ../../base
  # Uncomment to expose this instance publicly via Traefik → cloudflared.
  # Pair with the configMapGenerator patch below to switch the gateway bind off loopback.
  # - ingressroute.yaml

# Public exposure requires changing the gateway bind from "loopback" to "any".
# Uncomment together with ingressroute.yaml above.
# patches:
#   - path: configmap-patch.yaml
#     target:
#       kind: ConfigMap
#       name: openclaw-config

labels:
  - pairs:
      openclaw.instance: OPENCLAW_INSTANCE
    includeSelectors: true
