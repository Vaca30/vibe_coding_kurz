
# litellm_config.yaml
general_settings:
  store_model_in_db: true
  store_prompts_in_spend_logs: true
  enable_responses_api: true # because of openai codex
  drop_params: true # because of claude code 

litellm_settings:
  drop_params: true # because of claude code
  num_retries: 3
  disable_cooldowns: true # cooldown makes no sense with a single deployment

model_list:
    # vLLM Models (with proper tool/function calling support)
  # Running on RunPod - replace RUNPOD_POD_ID with your actual pod ID
  - model_name: runpod-qwen-35-35B
    litellm_params:
      model: hosted_vllm/Qwen/Qwen3.5-35B-A3B-GPTQ-Int4
      api_base: https://v4thm4unvhcgjq-8000.proxy.runpod.net/v1
      api_key: none
