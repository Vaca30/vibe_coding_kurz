      api_base: https://a3p42xn1hwkwsi-8000.proxy.runpod.net/v1
      api_key: none
  # Local vLLM Models
  - model_name: local-qwen-9b
    litellm_params:
      model: hosted_vllm/Qwen/Qwen3.5-9B
      api_base: http://127.0.0.1:8002/v1
      api_key: none
  - model_name: local-nemotron-nano-4b
    litellm_params:
      model: hosted_vllm/nvidia/NVIDIA-Nemotron-3-Nano-4B-BF16
      api_base: http://127.0.0.1:8003/v1
      api_key: none
  # Open Router
  - model_name: "or_qwen3-coder-free"
    litellm_params:
      model: "openrouter/qwen/qwen3-coder:free"
      api_key: "os.environ/OPENROUTER_API_KEY"
  - model_name: "or_qwen3-coder"
    litellm_params:
      model: "openrouter/qwen/qwen3-coder"
      api_key: "os.environ/OPENROUTER_API_KEY"
      extra_body:
        provider:
          order: ["deepinfra/turbo"]
          allow_fallbacks: false
  - model_name: "or_mimo-v2-pro"
    litellm_params:
      model: "openrouter/xiaomi/mimo-v2-pro"
      api_key: "os.environ/OPENROUTER_API_KEY"
  - model_name: "or_deepseek-v3.2"
    litellm_params:
      model: "openrouter/deepseek/deepseek-v3.2"
      api_key: "os.environ/OPENROUTER_API_KEY"
  - model_name: "or_step-3.5-flash"
    litellm_params:
      model: "openrouter/stepfun/step-3.5-flash"
      api_key: "os.environ/OPENROUTER_API_KEY"
  # LMStudio
  - model_name: lms-gpt-oss-20b
    litellm_params:
      model: lm_studio/openai/gpt-oss-20b
      api_base: http://localhost:1234/v1
  - model_name: lms-qwen3.5-9b
    litellm_params:
      model: lm_studio/qwen/qwen3.5-9b
      api_base: http://localhost:1234/v1
  
