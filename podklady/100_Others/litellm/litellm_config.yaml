  # vLLM in runpod - Qwen3-Coder-Next AWQ 4-bit (1x A100 80GB, $1.19/hr)
  - model_name: "claude-sonnet-4-20250514"
    litellm_params:
      model: hosted_vllm/bullpoint/Qwen3-Coder-Next-AWQ-4bit
      api_base: https://a3p42xn1hwkwsi-8000.proxy.runpod.net/v1
      api_key: none
  - model_name: "claude-opus-4-20250514"
    litellm_params:
      model: hosted_vllm/bullpoint/Qwen3-Coder-Next-AWQ-4bit
      api_base: https://a3p42xn1hwkwsi-8000.proxy.runpod.net/v1
      api_key: none
  - model_name: "claude-haiku-4-20250514"
    litellm_params:
