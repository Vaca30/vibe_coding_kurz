services:
  vllm:
    image: vllm/vllm-openai:nightly
    ports:
      - "8000:8000"
    volumes:
      - huggingface-cache:/root/.cache/huggingface
      - ./chat_template.jinja:/app/chat_template.jinja:ro
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HUGGING_FACE_HUB_TOKEN}
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    ipc: host

    # Qwen3.5-9B (AWQ 4-bit quantized)
    command:
      - --model
      - QuantTrio/Qwen3.5-9B-AWQ
      - --quantization
      - awq_marlin
      - --max-model-len
      - "8192"
      - --gpu-memory-utilization
      - "0.78"
      - --max-num-seqs
      - "2"
      - --enforce-eager
      - --enable-prefix-caching
      - --limit-mm-per-prompt
      - '{"image": 0, "video": 0}'
      - --chat-template
      - /app/chat_template.jinja
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_xml

volumes:
  huggingface-cache:
